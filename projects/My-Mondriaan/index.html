<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css Grid</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<!-- CSS grid Parent (i.e the main focus) -->
<body>
    <!-- CSS child of Body, and parent of items-->
    <main id="grid-container">
    <div id="item-1" class="blue"></div>
    <div id="item-2" class="white"></div>
    <div id="item-3" class="gray"></div>
    <div id="item-4" class="white"></div>
    <div id="item-5" class="white"></div>
    <div id="item-6" class="red"></div>
    <div id="item-7" class="white"></div>
    <div id="item-8" class="gray"></div>
    <div id="item-9" class="white"></div>
    <div id="item-10" class="yellow"></div>
    <div id="item-11" class="gray"></div>
    <div id="item-12" class="red"></div>
</main>
</body>
</html>
