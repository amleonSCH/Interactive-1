<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WOWZERS</title>

  <style>
    body{
      display: flex;
      justify-content: center;
      align-content:center;
      position: relative;
      
    }

  #vase {
  width: 130px;
  height: 250px;
  background: #7575f8;
  opacity: 0.6;
  margin-left: 200px; 
  margin-top: 140px;
  border-radius: 5% / 80%;
  position: absolute;
  z-index: 1;}

    #stem {
  width: 15px;
  height: 250px;
  rotate: 25deg;
  margin-left: 250px;
  margin-top: -30px;
  background: hsl(138, 98%, 19%);
}
  
       #flowers {
      display: block;
      width: 25px;
      height: 90px;
      background-color: #ffee00;
      margin-left: 300px;
      margin-top: 5px;
      position absolute;
      z-index: 1;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    }
    #flowers2{
      display: block;
      width: 25px;
      height: 90px;
      background-color: #ffee00;
      position absolute;
      z-index: 1;
      rotate: 50deg;
      margin-left: 320px;
      margin-top: -70px;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    }

    #flowers3 {
      display: block;
      width: 25px;
      height: 90px;
      background-color: #ffee00;
      position absolute;
      z-index: 1;
      margin-left: 275px;
      margin-top: -95px;
      rotate: -40deg;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    }
  
  #pineapple {
    display: block;
      width: 180px;
      height: 250px;
      background-color: hsl(59, 100%, 63%);
      border-radius: 40% 40% 50% 50% / 60% 60% 40% 40%;
      margin-top: 200px;
      margin-left: 30px;
      position:absolute;
      transform: rotate(-10deg);
      z-index: 1;
    }
#pineapple-spike {
  position:absolute;
  width: 200px;
  height: 200px;
  background-color: hwb(138 11% 41%);
  margin-top: -230px;
  rotate: -10deg;
  clip-path: polygon(
    50% 0%, 
    61% 35%, 
    98% 35%, 
    68% 57%, 
    79% 91%, 
    50% 70%, 
    21% 91%, 
    32% 57%, 
    2% 35%, 
    39% 35%
  );
}
#pineapple-spike-2 {
  position:absolute;
  width: 150px;
  height: 150px;
  background-color: lch(44.28% 53.9 144.47);
  margin-top: -215px;
  margin-left: 30px;
  rotate: 15deg;
  clip-path: polygon(
    50% 0%, 
    61% 35%, 
    98% 35%, 
    68% 57%, 
    79% 91%, 
    50% 70%, 
    21% 91%, 
    32% 57%, 
    2% 35%, 
    39% 35%
  );
}
#pineapple-spike-3 {
  position:absolute;
  width: 150px;
  height: 150px;
  background-color: oklab(39.359% -0.09318 0.05925);
  margin-top: -210px;
  margin-left: 25px;
  rotate: -25deg;
  clip-path: polygon(
    50% 0%, 
    61% 35%, 
    98% 35%, 
    68% 57%, 
    79% 91%, 
    50% 70%, 
    21% 91%, 
    32% 57%, 
    2% 35%, 
    39% 35%
  );
}

#pineapple-texture {
  z-index: 1;
  position: absolute;
  border-radius: 65% / 80%; 
  margin-top: -120px;
  margin-left: 35px;
  rotate: -10deg;
  width: 170px;
  height: 240px;
  background-image: linear-gradient(45deg,
      transparent,
      transparent 7px,
      rgb(113, 121, 126) 7px,
      rgb(113, 121, 126) 7.5px,
      transparent 7.5px,
      transparent 10px),
    linear-gradient(-45deg,
      transparent,
      transparent 7px,
      rgb(113, 121, 126) 7px,
      rgb(113, 121, 126) 7.5px,
      transparent 7.5px,
      transparent 10px);
  background-size: 10px 10px;
}

    #rectangle {
  width: 30px;
  height: 60px;
  background: blue;
  margin-left: 395px; 
  margin-top: 130px;
  border-radius: 5% / 80%; 
  position: absolute;}
  
  #body-mid {
      width: 0;
      height: 0;
      border-left: 55px solid transparent;
      border-right: 55px solid transparent;
      border-bottom: 100px solid blue;
      border-radius: 20% / 30%;
      margin-left: 355px;
      margin-top: 160px;
      position: absolute;
     
    }
    #body-base {
  width: 100px;
  height: 150px;
  background: blue;
  margin-left: 360px; 
   margin-top: 250px;
  border-radius: 5% / 80%;
  position: absolute;
  z-index: 1;
    }
  
    #table {
      width: 425px;
      height: 175px;
      transform: skew(-65deg);
      background: rgb(196, 196, 196);
      margin-top: 350px;
      position: absolute;
    }

  #apple-left {
      position: absolute;
      width: 120px;
      height: 110px;
      margin: 375px 0;
      margin-left: 275px;
      margin-top: 350px;
      background: rgb(201, 55, 32);
      border-radius: 90% / 50%;
      color: white;
      text-align: center;
      text-indent: .1em;
      z-index: 1;
    }
    #apple-body{
      content: '';
      position: absolute;
      top: 10%;
      bottom: 10%;
      right: -5%;
      left: -5%;
      background: inherit;
      border-radius: 5% / 50%;
      z-index: 1;
    }
 #apple-right{
      position: absolute;
      width: 110px;
      height: 100px;
      margin: 375px 0;
      margin-left: -10px;
      background: rgb(201, 55, 32);
      border-radius: 90% / 50%;
      color: white;
      text-align: center;
      text-indent: .1em;
      z-index: 1;
    }
    #apple-body-right{
      content: '';
      position: absolute;
      top: 10%;
      bottom: 10%;
      right: -5%;
      left: -5%;
      background: inherit;
      border-radius: 5% / 50%;
      z-index: 1;
    }
  </style>
</head>
<div>
<div id="rectangle"></div>
<div id="body-mid"></div>
<div id="body-base"></div>
<div id="table"></div>
<div id="vase"></div>
<div id="pineapple"></div>
<div id="flowers"></div>
<div id="flowers2"></div>
<div id="flowers3"></div>
<div id="stem"></div>
<div id="pineapple-spike"></div>
<div id="pineapple-spike-2"></div>
<div id="pineapple-spike-3"></div>
<div id="pineapple-texture"></div>

</div>

<body>


  <div id="apple-left"></div>
  <div id="apple-body"></div>
  <div id="apple-right"></div>
  <div id="apple-body-right"></div>

 


    


  
</body>
</html>
